# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ───────────────────────────────────────────────────────────
window_padding_width   8
hide_window_decorations no
confirm_os_window_close 0
scrollback_lines       10000
enable_audio_bell      no

# Translucent background; Hyprland's window blur frosts what's behind it.
# Text stays fully opaque. dynamic_ lets Ctrl+Shift+A then M/L/1/D change it
# live (more/less/opaque/default) without editing this file.
background_opacity         0.85
dynamic_background_opacity yes

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape        block
cursor_blink_interval 0

# ── Key mappings ─────────────────────────────────────────────────────
# Ctrl+Backspace -> send ^H, which .zshrc binds to backward-kill-word.
# (Terminals normally collapse Ctrl+Backspace into a plain Backspace.)
map ctrl+backspace send_text all \x08
# Ctrl+Delete -> forward kill word
map ctrl+delete    send_text all \x1b[3;5~
# Word-wise cursor movement
map ctrl+left      send_text all \x1b[1;5D
map ctrl+right     send_text all \x1b[1;5C

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

include colors-active.conf
